name: RedKross Security Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-checks:
    name: Test and Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check Python version
        run: python --version

      - name: Install dependencies and security tools
        run: |
          python -m pip install -r requirements.txt
          python -m pip install bandit pip-audit

      - name: Run automated tests
        run: python -m pytest -v

      - name: Scan Python code with Bandit
        run: bandit -r app.py

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Scan for exposed secrets
        run: python scripts/secret_scan.py

      - name: Validate SBOM
        run: python scripts/validate_sbom.py